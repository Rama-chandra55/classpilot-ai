name: ClassPilot Email Test

on:
  workflow_dispatch:
    inputs:
      recipient_email:
        description: 'Recipient Email Address for the test notification'
        required: true
        type: string
      course_id:
        description: 'Optional Course ID to search for an assignment'
        required: false
        type: string
        default: ''

concurrency:
  group: classpilot-email-test
  cancel-in-progress: false

jobs:
  run-email-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Create Google Credentials File
        id: google-creds
        run: |
          CREDS_PATH="$RUNNER_TEMP/google_web_credentials.json"
          printf '%s' "$GOOGLE_WEB_CREDENTIALS_JSON" > "$CREDS_PATH"
          chmod 600 "$CREDS_PATH"
          echo "CREDS_PATH=$CREDS_PATH" >> "$GITHUB_OUTPUT"
        env:
          GOOGLE_WEB_CREDENTIALS_JSON: ${{ secrets.GOOGLE_WEB_CREDENTIALS_JSON }}

      - name: Run Email Test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-2.5-flash-lite' }}
          GOOGLE_WEB_CREDENTIALS_PATH: ${{ steps.google-creds.outputs.CREDS_PATH }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_RECIPIENT_EMAIL: ${{ inputs.recipient_email }}
          TEST_COURSE_ID: ${{ inputs.course_id }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID || vars.TEST_USER_ID }}
        run: |
          python -m classpilot.job --test-email

