name: ClassPilot Watcher Simulation

'on':
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Optional Course ID to simulate (leave empty to simulate all active courses)'
        required: false
        type: string
        default: ''

concurrency:
  group: classpilot-watcher-simulation
  cancel-in-progress: false

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Create Google Credentials File
        id: google-creds
        run: |
          CREDS_PATH="$RUNNER_TEMP/google_web_credentials.json"
          printf '%s' "$GOOGLE_WEB_CREDENTIALS_JSON" > "$CREDS_PATH"
          chmod 600 "$CREDS_PATH"
          echo "CREDS_PATH=$CREDS_PATH" >> "$GITHUB_OUTPUT"
        env:
          GOOGLE_WEB_CREDENTIALS_JSON: ${{ secrets.GOOGLE_WEB_CREDENTIALS_JSON }}

      - name: Run Watcher Simulation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          GOOGLE_WEB_CREDENTIALS_PATH: ${{ steps.google-creds.outputs.CREDS_PATH }}
          SIMULATION_USER_ID: ${{ secrets.SIMULATION_USER_ID || vars.SIMULATION_USER_ID }}
          SIMULATION_COURSE_ID: ${{ inputs.course_id }}
        run: |
          python -m classpilot.job --simulate-watcher
