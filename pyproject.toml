[project]
name = "classpilot-ai"
version = "0.2.0"
description = "ClassPilot AI - an AI-powered academic assistant built on top of classroom-suite-mcp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    # --- Google (free LLM + Classroom/Drive APIs) ---
    "google-generativeai>=0.8.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "python-pptx>=1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "Pillow>=10.0.0",       # directly used by visual_extractor.py (PDF page-image dimensions);
                            # already a transitive dep of python-pptx, declared explicitly here
                            # so the dependency is honest about what actually needs it
    # --- Groq (free LLM alternative) ---
    "groq>=0.9.0",
    # --- inherited from the vendored classroom-suite-mcp server ---
    "fastmcp>=3.0.0",      # 3.x required for streamable-http transport
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]   # only needed if LLM_PROVIDER=anthropic (paid)

[project.scripts]
classpilot-ai     = "classpilot.main:main"
classpilot-ai-mcp  = "classpilot.server:main"
classpilot-ai-http = "classpilot.http_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["classpilot"]

